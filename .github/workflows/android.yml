name: Build, release and publish

# Every push builds and tests the app. When version.properties holds a version that has not been
# released yet (and the signing secrets exist), the APK is published as a GitHub release and the
# website (GitHub Pages, gh-pages branch) is updated with the new download.
on:
  push:
    branches: ["claude/android-keyboard-whisper-dictation-bd4ozi", "main", "master"]
    # Documentation-only changes do not need a new build.
    paths-ignore: ["CLAUDE.md", "README.md", "SECURITY.md", "docs/**", "fastlane/**"]
  workflow_dispatch:

# Least privilege: only what is needed to create releases and push the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_SIGNING_SECRET: ${{ secrets.TECLADO_KEYSTORE_BASE64 != '' && secrets.TECLADO_KEYSTORE_PASSWORD != '' }}
    steps:
      # Third-party actions are pinned to full commit SHAs (supply-chain protection).
      - name: Checkout (with whisper.cpp and llama.cpp)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (validates the wrapper checksum)
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load signing key from repository secrets
        if: env.HAS_SIGNING_SECRET == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.TECLADO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TECLADO_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "TECLADO_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "TECLADO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Warn when the signing key is missing
        if: env.HAS_SIGNING_SECRET != 'true'
        run: echo "::warning::Secrets TECLADO_KEYSTORE_BASE64/TECLADO_KEYSTORE_PASSWORD ausentes. O APK será assinado com uma chave temporária e não será publicado."

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Name the APK
        id: apk
        run: |
          NAME="Teclado-do-Fernando-Godinho-${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256

      - name: Release notes
        if: env.HAS_SIGNING_SECRET == 'true' && steps.version.outputs.released == 'false'
        run: |
          python3 - <<'PY'
          import re
          version = "${{ steps.version.outputs.version }}"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(version) + r".*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "Nova versão.") + "\n\n**Instalar:** baixe o APK abaixo pelo celular e abra o arquivo.\n"
          open("release-notes.md", "w", encoding="utf-8").write(body)
          PY
          echo "SHA-256: \`$(cut -d' ' -f1 "${{ steps.apk.outputs.name }}.sha256")\`" >> release-notes.md

      - name: Publish GitHub release
        if: env.HAS_SIGNING_SECRET == 'true' && steps.version.outputs.released == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Teclado do Fernando Godinho ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          make_latest: true
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256

      - name: Build website
        if: env.HAS_SIGNING_SECRET == 'true'
        run: python3 site/build.py --out _site --apk "${{ steps.apk.outputs.name }}"

      - name: Publish website (gh-pages)
        if: env.HAS_SIGNING_SECRET == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Site ${{ steps.version.outputs.version }}"
